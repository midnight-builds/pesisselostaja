name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workspaces:
    name: Lint, typecheck, test, build (all workspaces)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # apps/control renderöi thumbnailit Python-skriptillä (Pillow), koska
      # PIL tekee tekstin ja taustakuvan latauksen ilman natiiviriippuvuutta
      # Nodessa. Ilman tätä thumbnail-testit kaatuvat CI:ssä vaikka ne menevät
      # läpi kehityskoneella — ja ne on parempi ASENTAA kuin ohittaa: skripti
      # on ainoa asia joka tuottaa julkaistavan kuvan.
      - name: Install Pillow (thumbnail renderer)
        run: sudo apt-get install -y --no-install-recommends python3-pil

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
